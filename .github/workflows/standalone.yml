name: Standalone release validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare standalone checkout from the explicit inventory
        run: python tools/release_check.py stage --output .local/release-candidate
      - name: Build wheel and source distribution from that checkout
        working-directory: .local/release-candidate
        run: |
          python -m pip install build
          python -m build --outdir dist
          python tools/release_check.py archive dist/*
      - name: Install base wheel and exercise installed CLI and API
        working-directory: .local/release-candidate
        run: |
          python -m venv .local/base
          .local/base/bin/python -m pip install --no-deps dist/*.whl
          .local/base/bin/python -I tools/smoke_installed.py
      - name: Full synthetic provider, recovery, report and release checks
        working-directory: .local/release-candidate
        run: |
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[live,reports]', 'pypdf'])"
          python tools/release_check.py test --require-extras
          python -I tools/smoke_installed.py --reports
